# EldenKill settings (Elden Ring side). The ULTRAKILL side has its own:
# ULTRAKILL\BepInEx\config\dev.eldenkill.guest.cfg

# Where ULTRAKILL.exe is (empty: Desktop\ULTRAKILL, then the usual Steam folders)
ultrakill =
# Start ULTRAKILL by itself when Elden Ring starts (it runs hidden, off-screen)
start_ultrakill = 1
# Show ULTRAKILL's window instead (for debugging)
show_ultrakill = 0

# ULTRAKILL units per metre (2 = V1 the Tarnished's height but slow for Elden Ring's spaces; 1.5 = faster, a bit taller)
units_per_metre = 1.5
# Elden Ring HP per point of ULTRAKILL damage (a revolver shot is 1, a Filth has 0.5 HP)
damage_to_elden_ring = 60
# Bosses (over 3000 HP) take this share of it
boss_damage_factor = 0.5
# ULTRAKILL damage per 1% of the Tarnished's max HP an enemy takes off him
damage_to_v1 = 1.5

# Keys Elden Ring keeps (everything else goes to V1). Esc = Elden Ring's menu, E = interact
er_keys = Escape,E

# Elden Ring's frame rate limit: a number, or uncapped (60 = the game's own; er-patcher's patch, in memory)
fps = uncapped
# Ultrawide: no black bars on screens wider than 16:9 (er-patcher's patch, in memory)
ultrawide = 0
# The picture's shape for V1's view: 0 = the whole window (with ultrawide on), 1.7778 = 16:9
aspect = 1.7778

# Detailed logging into eldenkill.log
debug = 1

# Elden Ring's own volumes while V1 plays (0-10, -1 = leave yours)
er_sfx_volume = -1
er_voice_volume = -1

# The crosshair drawn over Elden Ring: 0 none, 1 cross, 2 cross with corners, -1 = ULTRAKILL's setting
crosshair = 0

# How tough Elden Ring enemies are, in ULTRAKILL health (a revolver shot = 1): normal, elite (over 1000 HP), boss (over 3000 HP)
uk_hp_normal = 3
uk_hp_elite = 10
uk_hp_boss = 80
